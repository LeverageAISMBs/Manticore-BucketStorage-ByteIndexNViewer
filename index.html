<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P1 · Storage, Index & Segment Contract — LEVERAGEAI · AGENT-HISTORY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0e17;
        color: #e2e8f0;
      }
    </style>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
                }
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
